name: Cadence
options:
  bundleIdPrefix: app.cadence
  deploymentTarget:
    iOS: "17.0"
packages:
  CadenceCore:
    path: Core
targets:
  Cadence:
    type: application
    platform: iOS
    sources:
      # Exclu d'ici et référencé via INFOPLIST_FILE ci-dessous : les deux ensemble feraient
      # copier le fichier deux fois ("multiple commands produce Info.plist").
      - path: CadenceApp
        excludes:
          - Info.plist
    dependencies:
      - package: CadenceCore
        product: CadenceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cadence.ios
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        # RÉGLAGE STANDARD, PAS `info.path` d'xcodegen : ce dernier régénère le fichier à chaque
        # `xcodegen generate` au lieu de le préserver — il a écrasé le nôtre une première fois,
        # perdant les déclarations `CFBundleDocumentTypes`. `INFOPLIST_FILE` se contente de
        # pointer Xcode vers un fichier qu'il ne touche jamais.
        INFOPLIST_FILE: CadenceApp/Info.plist
